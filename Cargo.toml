[package]
name = "vtt"
version = "0.2.0"
edition = "2021"
description = "Wortfluss: hold a key, speak, and the text is typed into any app; sessions transcribe lectures and meetings with notes."

[dependencies]
anyhow = "1"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
cpal = "0.15"                                   # microphone capture
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
getrandom = "0.4.3"
keyring = "4.2.0"
notify-rust = "4"                               # desktop notifications for errors (pure Rust D-Bus)
png = "0.18.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }   # HTTPS client with built-in rustls (no OpenSSL)

[target.'cfg(unix)'.dependencies]
libc = "0.2.191"

[target.'cfg(target_os = "linux")'.dependencies]
evdev = "0.12"                                  # global hotkey + virtual keyboard (uinput)
gvdb = "0.10.1"                                 # reads GNOME's settings (keyboard layout)
ksni = { version = "0.3.7", default-features = false, features = ["async-io", "blocking"] }
pulseaudio = "0.3.2"                            # sound-server inputs and recording
xkbcommon = { version = "0.9.0", default-features = false }

[target.'cfg(windows)'.dependencies]
tray-icon = "0.21"                              # notification-area icon with menu
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Console",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Com",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Shell",
] }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
