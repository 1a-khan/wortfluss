[package]
name = "vtt"
version = "0.1.0"
edition = "2021"
description = "Hold a key, speak, and the text is typed into whatever app has focus (Groq Whisper)."

[dependencies]
anyhow = "1"
base64 = "0.23.1"
chacha20poly1305 = "0.11.0"
cpal = "0.15"                                   # microphone capture
dialoguer = { version = "0.12.0", features = ["fuzzy-select"] }
evdev = "0.12"                                  # global hotkey + virtual keyboard (uinput)
getrandom = "0.4.3"
gvdb = "0.10.1"
keyring = "4.2.0"
libc = "0.2.191"
notify-rust = "4"                               # desktop notifications for errors (pure Rust D-Bus)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11.1"
toml = "0.8"
ureq = { version = "2", features = ["json"] }   # HTTPS client with built-in rustls (no OpenSSL)
xkbcommon = { version = "0.9.0", default-features = false }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
