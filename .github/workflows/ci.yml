name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Actions are pinned to commit hashes (a moved tag can't change what runs here);
# Dependabot proposes updates. The token can only read the repository.
permissions:
  contents: read

jobs:
  # Supply chain: known vulnerabilities, unmaintained crates, licenses, sources
  # (policy in deny.toml). A release needs this green too (scripts/release.sh).
  dependencies:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@17aeb3c839e42274e2b8adf721c8c65edfdc74dd # v2
        with:
          command: check

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: System libraries (ALSA, xkbcommon)
        run: sudo apt-get update && sudo apt-get install -y pkg-config libasound2-dev libxkbcommon-dev
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Upload binary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: vtt-linux-x86_64
          path: target/release/vtt

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - name: Build
        run: cargo build --release --locked
      - name: Test
        run: cargo test --release --locked
      - name: Smoke test (help, version, icon)
        shell: pwsh
        run: |
          target\release\vtt.exe version
          target\release\vtt.exe help | Select-Object -First 5
          target\release\vtt.exe _icons installer
          if (-not (Test-Path installer\wortfluss.ico)) { throw "icon missing" }
          # Version info, publisher and manifest are in both .exe files (build.rs).
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          foreach ($exe in "vtt.exe", "wortfluss.exe") {
            $info = (Get-Item "target\release\$exe").VersionInfo
            "$exe : $($info.ProductName) $($info.ProductVersion) / $($info.CompanyName) / $($info.FileDescription)"
            if ($info.ProductName -ne "Wortfluss" -or $info.ProductVersion -ne $version -or -not $info.CompanyName) { throw "$exe has no version info" }
            $bytes = [IO.File]::ReadAllBytes("target\release\$exe")
            if (-not ([Text.Encoding]::ASCII.GetString($bytes) -match 'requestedExecutionLevel level="asInvoker"')) { throw "$exe has no manifest" }
          }
      - name: Installer (Inno Setup)
        shell: pwsh
        run: |
          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) { choco install innosetup -y --no-progress }
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          & $iscc "/DAppVersion=$version" "/DBinDir=..\target\release" installer\wortfluss.iss
          if ($LASTEXITCODE -ne 0) { throw "installer build failed" }
      - name: Upload installer
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wortfluss-windows-x86_64
          path: |
            installer/Output/*.exe
            target/release/vtt.exe
            target/release/wortfluss.exe
