name: Feature request
description: An idea to make Wortfluss better
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What would you like to do?
      description: Describe the situation and what is missing or hard today.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: How could it work?
  - type: dropdown
    id: os
    attributes:
      label: System
      multiple: true
      options: [Linux, Windows]
