# Dependabot opens a pull request when a dependency or a GitHub Action has a new
# version; CI (build, tests, cargo-deny) runs on it before anything is merged.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      # Patch and minor updates in one PR a week instead of one per crate.
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
